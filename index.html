<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baseketball Scorecard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
            <div class="home-container">
                <h3>HOME</h3>
                <span id="home-score-display"></span>
                <div class="home-button">
                <button onclick="oneHomeAddition()">+1</button>
                <button onclick="twoHomeAddition()">+2</button>
                <button onclick="threeHomeAddition()">+3</button>
                </div>
            </div>
            <div class="guest-container">
                <h3>GUEST</h3>
                <span id="guest-score-display"></span>
                <div class="guest-button">
                <button onclick="oneGuestAddition()">+1</button>
                <button onclick="twoGuestAddition()">+2</button>
                <button onclick="threeGuestAddition()">+3</button>
                </div>
            </div>
        </div>

    
    <script src="script.js"></script>
</body>
</html>
